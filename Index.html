<!DOCTYPE html>
<html lang="ru">
  <head>
    <base target="_top" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2B6DE8" />
    <?!= include('FaviconHead'); ?>
    <?!= include('Styles'); ?>
  </head>
  <body>
    <div class="app">
      <header class="header">
        <div>
          <p class="brand">Доходы–расходы</p>
          <p class="muted" id="tzHint"></p>
        </div>
        <div class="balance-block" id="balanceBlock">
          <span class="muted">Баланс</span>
          <strong id="balance" class="balance">—</strong>
        </div>
      </header>

      <nav class="tabs" role="tablist">
        <button type="button" class="tab active" data-tab="home">Главная</button>
        <button type="button" class="tab" data-tab="finance">Финансы</button>
        <button type="button" class="tab" data-tab="notes">Заметки</button>
        <button type="button" class="tab" data-tab="cats">Категории</button>
      </nav>

      <section id="tab-home" class="tab-panel active">
        <div class="panel">
          <h2>Расходы / доходы</h2>
          <label>
            Фраза
            <input type="text" id="financeText" placeholder="500 на еду кофе" />
          </label>
          <div class="actions">
            <button type="button" class="btn primary" id="btnFinanceSend">Отправить</button>
          </div>
          <p class="muted home-hint">Голос — в Android-приложении.</p>
        </div>

        <div class="panel">
          <h2>Заметка</h2>
          <label>
            Текст
            <input type="text" id="todoText" placeholder="Завтра в 15:00 купить молоко" />
          </label>
          <div class="actions">
            <button type="button" class="btn primary" id="btnTodoSend">Отправить</button>
          </div>
        </div>
      </section>

      <section id="tab-finance" class="tab-panel">
        <div class="filters">
          <div class="presets">
            <button type="button" class="chip" data-preset="today">Сегодня</button>
            <button type="button" class="chip" data-preset="week">Неделя</button>
            <button type="button" class="chip" data-preset="month">Месяц</button>
            <button type="button" class="chip active" data-preset="all">Всё время</button>
          </div>
          <div class="range">
            <label>с <input type="date" id="dateFrom" /></label>
            <label>по <input type="date" id="dateTo" /></label>
            <button type="button" class="btn ghost" id="btnApplyRange">Показать</button>
          </div>
          <p class="period-sum muted" id="periodSum"></p>
        </div>

        <div class="panel">
          <h2>Новая запись вручную</h2>
          <form id="formAdd" class="form">
            <div class="row">
              <label class="grow">
                Тип
                <select id="addType" required>
                  <option value="expense">Расход</option>
                  <option value="income">Доход</option>
                </select>
              </label>
              <label class="grow">
                Сумма, ₽
                <input type="number" id="addAmount" min="0.01" step="0.01" required />
              </label>
            </div>
            <label id="addCategoryWrap">
              Категория
              <input
                type="text"
                id="addCategory"
                list="categoryList"
                placeholder="Выберите или введите новую"
                autocomplete="off"
              />
            </label>
            <label>
              Комментарий
              <input type="text" id="addComment" />
            </label>
            <div class="actions">
              <button type="submit" class="btn primary">Сохранить</button>
            </div>
          </form>
        </div>

        <div class="panel">
          <h2>Список</h2>
          <div id="txList" class="list"></div>
        </div>
      </section>

      <section id="tab-notes" class="tab-panel">
        <div class="panel">
          <label class="inline-check">
            <input type="checkbox" id="showDoneNotes" />
            Показывать завершённые
          </label>
          <div id="notesList" class="list"></div>
        </div>
      </section>

      <section id="tab-cats" class="tab-panel">
        <div class="panel">
          <h2>Категории расходов</h2>
          <form id="formAddCat" class="form inline">
            <input type="text" id="newCatName" placeholder="Новая категория" required />
            <button type="submit" class="btn primary">Добавить</button>
          </form>
          <div id="catList" class="list"></div>
        </div>
      </section>
    </div>

    <dialog id="dlgEdit">
      <form method="dialog" id="formEdit" class="form dialog-form">
        <h2>Редактирование</h2>
        <input type="hidden" id="editId" />
        <label>
          Дата
          <input type="datetime-local" id="editDate" required />
        </label>
        <div class="row">
          <label class="grow">
            Тип
            <select id="editType">
              <option value="expense">Расход</option>
              <option value="income">Доход</option>
            </select>
          </label>
          <label class="grow">
            Сумма, ₽
            <input type="number" id="editAmount" min="0.01" step="0.01" required />
          </label>
        </div>
        <label id="editCategoryWrap">
          Категория
          <input
            type="text"
            id="editCategory"
            list="categoryList"
            placeholder="Выберите или введите новую"
            autocomplete="off"
          />
        </label>
        <label>
          Комментарий
          <input type="text" id="editComment" />
        </label>
        <div class="actions">
          <button type="submit" class="btn primary" value="save">Сохранить</button>
          <button type="button" class="btn ghost" id="btnEditCancel">Отмена</button>
        </div>
      </form>
    </dialog>

    <dialog id="dlgVoice">
      <form method="dialog" id="formVoice" class="form dialog-form">
        <h2>Подтверждение — финансы</h2>
        <p class="muted" id="voiceRaw"></p>
        <p class="warn hidden" id="voiceParseHint"></p>
        <div class="row">
          <label class="grow">
            Тип
            <select id="voiceType">
              <option value="expense">Расход</option>
              <option value="income">Доход</option>
            </select>
          </label>
          <label class="grow">
            Сумма, ₽
            <input type="number" id="voiceAmount" min="0.01" step="0.01" required />
          </label>
        </div>
        <label id="voiceCategoryWrap">
          Категория
          <input
            type="text"
            id="voiceCategory"
            list="categoryList"
            placeholder="Выберите или введите новую"
            autocomplete="off"
          />
        </label>
        <p id="voiceNewHint" class="warn hidden">Категории ещё нет в справочнике — при записи она будет добавлена.</p>
        <label>
          Комментарий
          <input type="text" id="voiceComment" />
        </label>
        <div class="actions">
          <button type="submit" class="btn primary">Записать</button>
          <button type="button" class="btn ghost" id="btnVoiceCancel">Отмена</button>
        </div>
      </form>
    </dialog>

    <dialog id="dlgNote">
      <form method="dialog" id="formNote" class="form dialog-form">
        <h2 id="noteDlgTitle">Подтверждение — заметка</h2>
        <input type="hidden" id="noteEditId" />
        <p class="muted" id="noteRaw"></p>
        <p class="warn hidden" id="noteParseHint"></p>
        <label>
          Текст
          <input type="text" id="noteTextField" required />
        </label>
        <div class="row">
          <label class="grow">
            Дата выполнения
            <input type="date" id="noteDueDate" />
          </label>
          <label class="grow">
            Время
            <input type="time" id="noteDueTime" />
          </label>
        </div>
        <label class="inline-check">
          <input type="checkbox" id="noteDone" />
          Выполнено
        </label>
        <div class="actions">
          <button type="submit" class="btn primary" id="noteSaveBtn">Записать</button>
          <button type="button" class="btn danger hidden" id="noteDeleteBtn">Удалить</button>
          <button type="button" class="btn ghost" id="btnNoteCancel">Отмена</button>
        </div>
      </form>
    </dialog>

    <datalist id="categoryList"></datalist>

    <dialog id="dlgReplaceCat">
      <form method="dialog" id="formReplaceCat" class="form dialog-form">
        <h2>Удаление категории</h2>
        <p id="replaceCatText"></p>
        <input type="hidden" id="replaceCatId" />
        <label>
          Заменить на
          <select id="replaceCatSelect" required></select>
        </label>
        <div class="actions">
          <button type="submit" class="btn danger">Удалить</button>
          <button type="button" class="btn ghost" id="btnReplaceCancel">Отмена</button>
        </div>
      </form>
    </dialog>

    <?!= include('Client'); ?>
  </body>
</html>
