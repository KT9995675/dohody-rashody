<script>
  (function () {
    var state = {
      categories: [],
      transactions: [],
      notes: [],
      balance: 0,
      timeZone: '',
      loaded: false,
      filter: { from: '', to: '' },
      preset: 'all',
      voiceDraft: null,
      noteDraft: null,
      noteEditMode: 'create',
      activeTab: 'home'
    };

    function $(id) {
      return document.getElementById(id);
    }

    function run(fnName) {
      var args = Array.prototype.slice.call(arguments, 1);
      return new Promise(function (resolve, reject) {
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(reject)[fnName].apply(null, args);
      });
    }

    function formatMoney(n) {
      return (
        Number(n).toLocaleString('ru-RU', {
          minimumFractionDigits: 0,
          maximumFractionDigits: 2
        }) + ' ₽'
      );
    }

    function formatDate(iso) {
      if (!iso) return '';
      var d = new Date(iso);
      return d.toLocaleString('ru-RU', {
        day: '2-digit',
        month: '2-digit',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    function formatNoteWhen(note) {
      var parts = [];
      if (note.dueDate) {
        var d = note.dueDate.split('-');
        parts.push(d[2] + '.' + d[1] + '.' + d[0]);
      }
      if (note.dueTime) parts.push(note.dueTime);
      return parts.length ? parts.join(' ') : 'Без даты';
    }

    function toDatetimeLocal(iso) {
      if (!iso) return '';
      var d = new Date(iso);
      var pad = function (n) {
        return ('0' + n).slice(-2);
      };
      return (
        d.getFullYear() +
        '-' +
        pad(d.getMonth() + 1) +
        '-' +
        pad(d.getDate()) +
        'T' +
        pad(d.getHours()) +
        ':' +
        pad(d.getMinutes())
      );
    }

    function ymd(d) {
      var pad = function (n) {
        return ('0' + n).slice(-2);
      };
      return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    }

    function startOfWeek(d) {
      var x = new Date(d);
      var day = (x.getDay() + 6) % 7;
      x.setDate(x.getDate() - day);
      x.setHours(0, 0, 0, 0);
      return x;
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function txDay(iso) {
      if (!iso) return '';
      var s = String(iso);
      if (s.length >= 10 && s.charAt(4) === '-') return s.slice(0, 10);
      var d = new Date(iso);
      if (isNaN(d.getTime())) return '';
      return ymd(d);
    }

    function recomputeBalance() {
      var b = 0;
      state.transactions.forEach(function (t) {
        if (t.type === 'income') b += Number(t.amount) || 0;
        else if (t.type === 'expense') b -= Number(t.amount) || 0;
      });
      state.balance = Math.round(b * 100) / 100;
    }

    function filteredTransactions() {
      var from = state.filter.from || '';
      var to = state.filter.to || '';
      return state.transactions
        .filter(function (t) {
          var day = txDay(t.date);
          if (from && day && day < from) return false;
          if (to && day && day > to) return false;
          return true;
        })
        .sort(function (a, b) {
          return String(b.date || '').localeCompare(String(a.date || ''));
        });
    }

    function periodSums(list) {
      var income = 0;
      var expense = 0;
      list.forEach(function (t) {
        if (t.type === 'income') income += Number(t.amount) || 0;
        else expense += Number(t.amount) || 0;
      });
      return {
        periodIncome: Math.round(income * 100) / 100,
        periodExpense: Math.round(expense * 100) / 100
      };
    }

    function sortedNotes(includeDone) {
      var list = (state.notes || []).filter(function (n) {
        return includeDone || !n.done;
      });
      list.sort(function (a, b) {
        var aHas = !!a.dueDate;
        var bHas = !!b.dueDate;
        if (aHas && !bHas) return -1;
        if (!aHas && bHas) return 1;
        if (aHas && bHas) {
          if (a.dueDate !== b.dueDate) return a.dueDate < b.dueDate ? -1 : 1;
          var at = a.dueTime || '99:99';
          var bt = b.dueTime || '99:99';
          if (at !== bt) return at < bt ? -1 : 1;
        }
        return 0;
      });
      return list;
    }

    function applySnapshot(data) {
      var dash = data.dashboard || {};
      state.transactions = dash.transactions || [];
      state.categories = data.categories || dash.categories || [];
      state.notes = data.notes || [];
      if (dash.balance != null) state.balance = dash.balance;
      else recomputeBalance();
      state.timeZone = data.timeZone || dash.timeZone || state.timeZone;
      state.loaded = true;
      if (state.timeZone) {
        $('tzHint').textContent = 'Часовой пояс: ' + state.timeZone;
      }
      renderAll();
    }

    /** Full load from Sheets — once at start (and after mutations). */
    function loadBootstrap() {
      return run('apiBootstrap').then(applySnapshot);
    }

    function renderAll() {
      renderFinanceFromCache();
      renderNotesFromCache();
      renderCategories();
      refreshCategoryList();
      syncCategoryVisibility('addType', 'addCategoryWrap');
    }

    function renderFinanceFromCache() {
      var list = filteredTransactions();
      var sums = periodSums(list);
      renderBalance(state.balance);
      renderPeriod(sums);
      renderTransactions(list);
    }

    function renderNotesFromCache() {
      renderNotes(sortedNotes($('showDoneNotes').checked));
    }

    /** Keep old names as aliases for call sites. */
    function loadDashboard() {
      if (!state.loaded) return loadBootstrap();
      renderFinanceFromCache();
      return Promise.resolve();
    }

    function loadNotes() {
      if (!state.loaded) return loadBootstrap();
      renderNotesFromCache();
      return Promise.resolve();
    }

    function afterWrite() {
      return loadBootstrap().catch(showError);
    }

    function refreshCategoryList() {
      var dl = $('categoryList');
      if (!dl) return;
      dl.innerHTML = '';
      state.categories.forEach(function (c) {
        var opt = document.createElement('option');
        opt.value = c.name;
        dl.appendChild(opt);
      });
    }

    function syncCategoryVisibility(typeSelectId, wrapId) {
      var isExpense = $(typeSelectId).value === 'expense';
      $(wrapId).classList.toggle('hidden', !isExpense);
    }

    function bindCategoryUi(typeId, wrapId) {
      $(typeId).addEventListener('change', function () {
        syncCategoryVisibility(typeId, wrapId);
      });
    }

    function resolveCategoryInput(inputId) {
      var name = $(inputId).value.trim();
      if (!name) throw new Error('Укажите категорию');
      var known = state.categories.some(function (c) {
        return c.name.toLowerCase() === name.toLowerCase();
      });
      if (!known) {
        var ok = confirm('Категории «' + name + '» ещё нет. Добавить в справочник?');
        if (!ok) throw new Error('Выберите существующую категорию или подтвердите новую');
      }
      return { category: name, confirmNewCategory: !known };
    }

    function showError(err) {
      alert(err && err.message ? err.message : String(err));
    }

    function setActiveTab(name) {
      state.activeTab = name;
      document.querySelectorAll('.tab').forEach(function (b) {
        b.classList.toggle('active', b.getAttribute('data-tab') === name);
      });
      document.querySelectorAll('.tab-panel').forEach(function (p) {
        p.classList.remove('active');
      });
      $('tab-' + name).classList.add('active');
      $('balanceBlock').classList.toggle('hidden-balance', name !== 'finance');
      if (name === 'finance') renderFinanceFromCache();
      if (name === 'notes') renderNotesFromCache();
      if (name === 'cats') renderCategories();
    }

    function renderBalance(balance) {
      var el = $('balance');
      el.textContent = formatMoney(balance);
      el.classList.toggle('pos', balance >= 0);
      el.classList.toggle('neg', balance < 0);
    }

    function renderPeriod(data) {
      if (!state.filter.from && !state.filter.to) {
        $('periodSum').textContent = '';
        return;
      }
      $('periodSum').textContent =
        'За период: +' +
        formatMoney(data.periodIncome) +
        ' / −' +
        formatMoney(data.periodExpense);
    }

    function renderTransactions(list) {
      var root = $('txList');
      root.innerHTML = '';
      if (!list.length) {
        root.innerHTML = '<p class="muted">Записей нет</p>';
        return;
      }
      list.forEach(function (t) {
        var div = document.createElement('div');
        div.className = 'item';
        var title =
          (t.type === 'income' ? 'Доход' : 'Расход') +
          (t.category ? ' · ' + t.category : '');
        div.innerHTML =
          '<div><div>' +
          escapeHtml(title) +
          '</div><div class="meta">' +
          escapeHtml(formatDate(t.date)) +
          (t.comment ? ' · ' + escapeHtml(t.comment) : '') +
          '</div></div>' +
          '<div class="sum ' +
          t.type +
          '">' +
          (t.type === 'income' ? '+' : '−') +
          formatMoney(t.amount) +
          '</div>' +
          '<div class="item-actions">' +
          '<button type="button" class="btn small" data-edit="' +
          t.id +
          '">Изменить</button>' +
          '<button type="button" class="btn small" data-del="' +
          t.id +
          '">Удалить</button>' +
          '</div>';
        root.appendChild(div);
      });
    }

    function renderNotes(list) {
      var root = $('notesList');
      root.innerHTML = '';
      if (!list.length) {
        root.innerHTML = '<p class="muted">Заметок нет</p>';
        return;
      }
      list.forEach(function (n) {
        var div = document.createElement('div');
        div.className = 'item note-item' + (n.done ? ' done-note' : '');
        div.innerHTML =
          '<div class="note-row">' +
          '<label class="note-done-check">' +
          '<input type="checkbox" data-note-done="' +
          n.id +
          '"' +
          (n.done ? ' checked' : '') +
          ' />' +
          '</label>' +
          '<button type="button" class="note-title-btn" data-note-edit="' +
          n.id +
          '" title="Изменить текст">' +
          escapeHtml(n.text) +
          '</button>' +
          '<input type="date" class="note-date" data-note-date="' +
          n.id +
          '" value="' +
          escapeHtml(n.dueDate || '') +
          '" title="Дата" />' +
          '<input type="time" class="note-time" data-note-time="' +
          n.id +
          '" value="' +
          escapeHtml(n.dueTime || '') +
          '" title="Время" />' +
          '<button type="button" class="btn small note-del" data-note-del="' +
          n.id +
          '">×</button>' +
          '</div>';
        root.appendChild(div);
      });
    }

    function patchNoteFromList(id, patch) {
      var note = null;
      for (var i = 0; i < state.notes.length; i++) {
        if (state.notes[i].id === id) {
          note = state.notes[i];
          break;
        }
      }
      if (!note) return Promise.reject(new Error('Заметка не найдена'));
      var payload = {
        text: note.text,
        dueDate: note.dueDate || '',
        dueTime: note.dueTime || '',
        done: !!note.done
      };
      Object.keys(patch).forEach(function (k) {
        payload[k] = patch[k];
        note[k] = patch[k];
      });
      renderNotesFromCache();
      return run('apiUpdateNote', id, payload).then(function () {
        return afterWrite();
      });
    }

    function renderCategories() {
      var root = $('catList');
      root.innerHTML = '';
      if (!state.categories.length) {
        root.innerHTML = '<p class="muted">Категорий пока нет</p>';
        return;
      }
      state.categories.forEach(function (c) {
        var div = document.createElement('div');
        div.className = 'item cat-item';
        div.innerHTML =
          '<div class="cat-row">' +
          '<input type="text" class="cat-name-input" data-cat-id="' +
          c.id +
          '" value="' +
          escapeHtml(c.name) +
          '" title="Название" />' +
          '<button type="button" class="btn small cat-save" data-cat-save="' +
          c.id +
          '">Сохранить</button>' +
          '<button type="button" class="btn small cat-del" data-cat-del="' +
          c.id +
          '" title="Удалить">×</button>' +
          '</div>';
        root.appendChild(div);
      });
    }

    function applyPreset(name) {
      state.preset = name;
      document.querySelectorAll('.chip').forEach(function (el) {
        el.classList.toggle('active', el.getAttribute('data-preset') === name);
      });
      var today = new Date();
      today.setHours(0, 0, 0, 0);
      if (name === 'all') {
        state.filter = { from: '', to: '' };
        $('dateFrom').value = '';
        $('dateTo').value = '';
      } else if (name === 'today') {
        state.filter = { from: ymd(today), to: ymd(today) };
        $('dateFrom').value = state.filter.from;
        $('dateTo').value = state.filter.to;
      } else if (name === 'week') {
        var from = startOfWeek(today);
        state.filter = { from: ymd(from), to: ymd(today) };
        $('dateFrom').value = state.filter.from;
        $('dateTo').value = state.filter.to;
      } else if (name === 'month') {
        var mFrom = new Date(today.getFullYear(), today.getMonth(), 1);
        state.filter = { from: ymd(mFrom), to: ymd(today) };
        $('dateFrom').value = state.filter.from;
        $('dateTo').value = state.filter.to;
      }
      loadDashboard().catch(showError);
    }

    function openVoiceDialog(parsed, rawText) {
      var draft = (parsed && parsed.draft) || { rawText: rawText };
      state.voiceDraft = draft;
      $('voiceRaw').textContent = '«' + rawText + '»';
      var hint = $('voiceParseHint');
      if (parsed && !parsed.ok && parsed.error) {
        hint.textContent = parsed.error;
        hint.classList.remove('hidden');
      } else {
        hint.textContent = '';
        hint.classList.add('hidden');
      }
      $('voiceType').value = draft.type || 'expense';
      $('voiceAmount').value = draft.amount != null ? draft.amount : '';
      $('voiceComment').value = draft.comment || '';
      $('voiceCategory').value = draft.category || '';
      if (draft.categoryIsNew && draft.category) {
        $('voiceNewHint').classList.remove('hidden');
      } else {
        $('voiceNewHint').classList.add('hidden');
      }
      syncCategoryVisibility('voiceType', 'voiceCategoryWrap');
      $('dlgVoice').showModal();
    }

    function openNoteDialog(mode, parsed, rawText, existing) {
      state.noteEditMode = mode;
      var draft = (parsed && parsed.draft) || existing || {};
      state.noteDraft = draft;
      $('noteEditId').value = existing ? existing.id : '';
      $('noteDlgTitle').textContent =
        mode === 'edit' ? 'Редактирование заметки' : 'Подтверждение — заметка';
      $('noteSaveBtn').textContent = mode === 'edit' ? 'Сохранить' : 'Записать';
      $('noteDeleteBtn').classList.toggle('hidden', mode !== 'edit');
      $('noteRaw').textContent = rawText ? '«' + rawText + '»' : '';
      $('noteRaw').classList.toggle('hidden', !rawText);
      var hint = $('noteParseHint');
      if (parsed && !parsed.ok && parsed.error) {
        hint.textContent = parsed.error;
        hint.classList.remove('hidden');
      } else {
        hint.textContent = '';
        hint.classList.add('hidden');
      }
      $('noteTextField').value = draft.text || (existing && existing.text) || '';
      $('noteDueDate').value = draft.dueDate || (existing && existing.dueDate) || '';
      $('noteDueTime').value = draft.dueTime || (existing && existing.dueTime) || '';
      $('noteDone').checked = !!(existing && existing.done);
      $('dlgNote').showModal();
    }

    document.querySelectorAll('.tab').forEach(function (btn) {
      btn.addEventListener('click', function () {
        setActiveTab(btn.getAttribute('data-tab'));
      });
    });

    document.querySelectorAll('.chip').forEach(function (chip) {
      chip.addEventListener('click', function () {
        applyPreset(chip.getAttribute('data-preset'));
      });
    });

    $('btnApplyRange').addEventListener('click', function () {
      state.preset = 'custom';
      document.querySelectorAll('.chip').forEach(function (el) {
        el.classList.remove('active');
      });
      state.filter = {
        from: $('dateFrom').value || '',
        to: $('dateTo').value || ''
      };
      loadDashboard().catch(showError);
    });

    $('showDoneNotes').addEventListener('change', function () {
      loadNotes().catch(showError);
    });

    bindCategoryUi('addType', 'addCategoryWrap');
    bindCategoryUi('editType', 'editCategoryWrap');
    bindCategoryUi('voiceType', 'voiceCategoryWrap');

    $('btnFinanceSend').addEventListener('click', function () {
      var text = $('financeText').value.trim();
      if (!text) return;
      run('apiParseNote', text)
        .then(function (parsed) {
          $('financeText').value = '';
          openVoiceDialog(parsed, text);
        })
        .catch(showError);
    });

    $('financeText').addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter') {
        ev.preventDefault();
        $('btnFinanceSend').click();
      }
    });

    $('btnTodoSend').addEventListener('click', function () {
      var text = $('todoText').value.trim();
      if (!text) return;
      run('apiParseTodoNote', text)
        .then(function (parsed) {
          $('todoText').value = '';
          openNoteDialog('create', parsed, text);
        })
        .catch(showError);
    });

    $('todoText').addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter') {
        ev.preventDefault();
        $('btnTodoSend').click();
      }
    });

    $('formAdd').addEventListener('submit', function (ev) {
      ev.preventDefault();
      try {
        var payload = {
          type: $('addType').value,
          amount: Number($('addAmount').value),
          comment: $('addComment').value,
          source: 'manual'
        };
        if (payload.type === 'expense') {
          var cat = resolveCategoryInput('addCategory');
          payload.category = cat.category;
          payload.confirmNewCategory = cat.confirmNewCategory;
        }
        run('apiCreateTransaction', payload)
          .then(function () {
            $('formAdd').reset();
            $('addType').value = 'expense';
            return afterWrite();
          })
          .catch(showError);
      } catch (e) {
        showError(e);
      }
    });

    $('txList').addEventListener('click', function (ev) {
      var editId = ev.target.getAttribute('data-edit');
      var delId = ev.target.getAttribute('data-del');
      if (editId) openEdit(editId);
      if (delId) {
        if (!confirm('Удалить запись?')) return;
        run('apiDeleteTransaction', delId)
          .then(afterWrite)
          .catch(showError);
      }
    });

    $('notesList').addEventListener('click', function (ev) {
      var editId = ev.target.getAttribute('data-note-edit');
      var delId = ev.target.getAttribute('data-note-del');
      if (editId) {
        var cached = null;
        for (var i = 0; i < state.notes.length; i++) {
          if (state.notes[i].id === editId) {
            cached = state.notes[i];
            break;
          }
        }
        if (cached) openNoteDialog('edit', null, '', cached);
        else {
          run('apiGetNote', editId)
            .then(function (note) {
              openNoteDialog('edit', null, '', note);
            })
            .catch(showError);
        }
      }
      if (delId) {
        if (!confirm('Удалить заметку?')) return;
        run('apiDeleteNote', delId)
          .then(afterWrite)
          .catch(showError);
      }
    });

    $('notesList').addEventListener('change', function (ev) {
      var t = ev.target;
      var doneId = t.getAttribute('data-note-done');
      var dateId = t.getAttribute('data-note-date');
      var timeId = t.getAttribute('data-note-time');
      if (doneId) {
        patchNoteFromList(doneId, { done: !!t.checked })
          .catch(function (err) {
            showError(err);
            afterWrite();
          });
        return;
      }
      if (dateId) {
        patchNoteFromList(dateId, { dueDate: t.value || '' })
          .catch(function (err) {
            showError(err);
            afterWrite();
          });
        return;
      }
      if (timeId) {
        patchNoteFromList(timeId, { dueTime: t.value || '' })
          .catch(function (err) {
            showError(err);
            afterWrite();
          });
      }
    });

    function openEdit(id) {
      var t = null;
      for (var i = 0; i < state.transactions.length; i++) {
        if (state.transactions[i].id === id) {
          t = state.transactions[i];
          break;
        }
      }
      if (!t) {
        showError(new Error('Запись не найдена'));
        return;
      }
      $('editId').value = t.id;
      $('editDate').value = toDatetimeLocal(t.date);
      $('editType').value = t.type;
      $('editAmount').value = t.amount;
      $('editComment').value = t.comment || '';
      $('editCategory').value = t.category || '';
      syncCategoryVisibility('editType', 'editCategoryWrap');
      $('dlgEdit').showModal();
    }

    $('btnEditCancel').addEventListener('click', function () {
      $('dlgEdit').close();
    });

    $('formEdit').addEventListener('submit', function (ev) {
      ev.preventDefault();
      try {
        var id = $('editId').value;
        var payload = {
          type: $('editType').value,
          amount: Number($('editAmount').value),
          comment: $('editComment').value,
          date: $('editDate').value
        };
        if (payload.type === 'expense') {
          var cat = resolveCategoryInput('editCategory');
          payload.category = cat.category;
          payload.confirmNewCategory = cat.confirmNewCategory;
        } else {
          payload.category = '';
        }
        run('apiUpdateTransaction', id, payload)
          .then(function () {
            $('dlgEdit').close();
            return afterWrite();
          })
          .catch(showError);
      } catch (e) {
        showError(e);
      }
    });

    $('formAddCat').addEventListener('submit', function (ev) {
      ev.preventDefault();
      run('apiAddCategory', $('newCatName').value)
        .then(function () {
          $('newCatName').value = '';
          return afterWrite();
        })
        .catch(showError);
    });

    $('catList').addEventListener('click', function (ev) {
      var saveId = ev.target.getAttribute('data-cat-save');
      var delId = ev.target.getAttribute('data-cat-del');
      if (saveId) {
        var input = document.querySelector('.cat-name-input[data-cat-id="' + saveId + '"]');
        var name = input ? input.value.trim() : '';
        if (!name) {
          alert('Укажите название');
          return;
        }
        run('apiRenameCategory', saveId, name)
          .then(afterWrite)
          .catch(showError);
      }
      if (delId) {
        var usageName = state.categories.filter(function (c) {
          return c.id === delId;
        })[0];
        var usageCount = state.transactions.filter(function (t) {
          return (
            usageName &&
            t.category &&
            t.category.toLowerCase() === usageName.name.toLowerCase()
          );
        }).length;
        if (usageCount === 0) {
          if (!confirm('Удалить категорию «' + (usageName ? usageName.name : '') + '»?')) return;
          run('apiDeleteCategory', delId, '')
            .then(afterWrite)
            .catch(showError);
          return;
        }
        $('replaceCatId').value = delId;
        $('replaceCatText').textContent =
          'Категория «' +
          usageName.name +
          '» используется в ' +
          usageCount +
          ' записях. Выберите замену:';
        var sel = $('replaceCatSelect');
        sel.innerHTML = '';
        state.categories.forEach(function (c) {
          if (c.id === delId) return;
          var opt = document.createElement('option');
          opt.value = c.name;
          opt.textContent = c.name;
          sel.appendChild(opt);
        });
        if (!sel.options.length) {
          alert('Сначала добавьте другую категорию для замены.');
          return;
        }
        $('dlgReplaceCat').showModal();
      }
    });

    $('btnReplaceCancel').addEventListener('click', function () {
      $('dlgReplaceCat').close();
    });

    $('formReplaceCat').addEventListener('submit', function (ev) {
      ev.preventDefault();
      run('apiDeleteCategory', $('replaceCatId').value, $('replaceCatSelect').value)
        .then(function () {
          $('dlgReplaceCat').close();
          return afterWrite();
        })
        .catch(showError);
    });

    $('btnVoiceCancel').addEventListener('click', function () {
      $('dlgVoice').close();
    });

    $('formVoice').addEventListener('submit', function (ev) {
      ev.preventDefault();
      try {
        var payload = {
          type: $('voiceType').value,
          amount: Number($('voiceAmount').value),
          comment: $('voiceComment').value,
          source: 'web_text',
          rawText: (state.voiceDraft && state.voiceDraft.rawText) || ''
        };
        if (payload.type === 'expense') {
          var cat = resolveCategoryInput('voiceCategory');
          payload.category = cat.category;
          payload.confirmNewCategory = cat.confirmNewCategory;
        }
        run('apiCreateTransaction', payload)
          .then(function () {
            $('dlgVoice').close();
            return afterWrite().then(function () {
              setActiveTab('finance');
            });
          })
          .catch(showError);
      } catch (e) {
        showError(e);
      }
    });

    $('btnNoteCancel').addEventListener('click', function () {
      $('dlgNote').close();
    });

    $('noteDeleteBtn').addEventListener('click', function () {
      var id = $('noteEditId').value;
      if (!id || !confirm('Удалить заметку?')) return;
      run('apiDeleteNote', id)
        .then(function () {
          $('dlgNote').close();
          return afterWrite();
        })
        .catch(showError);
    });

    $('formNote').addEventListener('submit', function (ev) {
      ev.preventDefault();
      var payload = {
        text: $('noteTextField').value.trim(),
        dueDate: $('noteDueDate').value || '',
        dueTime: $('noteDueTime').value || '',
        done: $('noteDone').checked,
        rawText: (state.noteDraft && state.noteDraft.rawText) || ''
      };
      if (!payload.text) {
        alert('Укажите текст заметки');
        return;
      }
      var id = $('noteEditId').value;
      var p =
        state.noteEditMode === 'edit'
          ? run('apiUpdateNote', id, payload)
          : run('apiCreateNote', Object.assign({ source: 'web_text' }, payload));
      p.then(function () {
        $('dlgNote').close();
        return afterWrite().then(function () {
          setActiveTab('notes');
        });
      }).catch(showError);
    });

    setActiveTab('home');
    loadBootstrap().catch(showError);
  })();
</script>
